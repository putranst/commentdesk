<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comment Desk — BUMEN</title><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font:400 15px/1.6 system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-page{width:100%;max-width:440px;padding:24px}
.login-card{background:#fff;border-radius:20px;padding:48px 36px 40px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06);text-align:center}
.logo{width:64px;height:auto;margin-bottom:24px}
.login-card h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.login-card .subtitle{color:#64748b;font-size:14px;margin-bottom:28px}
.alert{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:14px 18px;color:#4338ca;font-size:13px;line-height:1.6;margin-bottom:24px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.alert-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.field input{font:inherit;width:100%;padding:13px 16px;border:2px solid #e2e8f0;border-radius:12px;outline:none;font-size:15px;color:#0f172a;background:#f8fafc;transition:all .2s}
.field input:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(129,140,248,.1);background:#fff}
.field input::placeholder{color:#94a3b8}
.btn{font:inherit;font-weight:700;cursor:pointer;border:none;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{width:100%;padding:15px;border-radius:12px;font-size:15px;letter-spacing:-.2px;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.25)}
.btn-primary:hover{box-shadow:0 6px 24px rgba(99,102,241,.35)}
.error{color:#ef4444;font-size:13px;margin-top:10px;min-height:20px}
@media(max-width:480px){.login-card{padding:36px 24px 32px}}
</style></head><body>
<div class="login-page">
<div class="login-card">
<img class="logo" src="/logo.png" alt="BuMen">
<h1>Comment Desk</h1>
<p class="subtitle">Internal workspace by BUMEN Intelligence</p>
<div class="alert">
<span class="alert-icon">💡</span>
<span>Komentar hanya untuk direview &amp; dicopy. Tidak ada yang diposting otomatis ke Instagram.</span>
</div>
<div class="field">
<label for="handle">Handle Anda</label>
<input id="handle" placeholder="contoh: reviewer-01" maxlength="40" autocomplete="off">
</div>
<button class="btn btn-primary" onclick="login()">Masuk ke Workspace</button>
<p class="error" id="err"></p>
</div>
</div>
<script>
const $=id=>document.getElementById(id)
async function login(){
const h=$("handle").value.trim()
if(!h)return $("err").textContent="Isi handle dulu ya"
try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({handle:h})});if(!r.ok){const d=await r.json();throw Error(d.error||"Login gagal")};location.reload()}catch(e){$("err").textContent=e.message;$("err").style.color="#ef4444"}}
</script>
</body></html>
