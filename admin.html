<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUMEN Intelligence — Admin</title><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font:400 14px/1.6 system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-page{width:100%;max-width:420px;padding:24px}
.login-card{background:#fff;border-radius:20px;padding:52px 40px 44px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06);text-align:center}
.logo{width:72px;height:auto;margin-bottom:20px;display:block;margin-left:auto;margin-right:auto}
.login-card h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;color:#0f172a}
.login-card .subtitle{color:#64748b;font-size:14px;margin-bottom:32px}
.field{margin-bottom:18px;text-align:left}
.field label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.field input{font:inherit;width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;outline:none;font-size:15px;color:#0f172a;background:#f8fafc;transition:all .2s}
.field input:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(129,140,248,.1);background:#fff}
.field input::placeholder{color:#94a3b8}
.footer-links{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px}
.footer-links a{color:#6366f1;text-decoration:none;font-weight:600}
.footer-links a:hover{text-decoration:underline}
.btn{font:inherit;font-weight:700;cursor:pointer;border:none;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{width:100%;padding:15px;border-radius:12px;font-size:15px;letter-spacing:-.2px;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.25)}
.btn-primary:hover{box-shadow:0 6px 24px rgba(99,102,241,.35)}
.error{color:#ef4444;font-size:13px;margin-top:10px;min-height:20px}
.divider{display:flex;align-items:center;margin:28px 0;color:#cbd5e1;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
.divider span{padding:0 16px}
@media(max-width:480px){.login-card{padding:40px 28px 36px}}
</style></head><body>
<div class="login-page">
<div class="login-card">
<img class="logo" src="/logo.png" alt="BuMen">
<h1>BUMEN Intelligence</h1>
<p class="subtitle">Social Media Intelligence Platform</p>
<div class="field">
<label for="pwd">Password Admin</label>
<input id="pwd" type="password" placeholder="Masukkan password" autocomplete="off">
</div>
<button class="btn btn-primary" onclick="login()">Masuk ke Dashboard</button>
<p class="error" id="err"></p>
<div class="divider"><span>atau</span></div>
<p style="font-size:12px;color:#94a3b8;text-align:center">
Butuh akses admin? Hubungi <a href="#" style="color:#6366f1;text-decoration:none;font-weight:600">ops@bumen.id</a>
</p>
</div>
</div>
<script>
const $=id=>document.getElementById(id)
async function login(){
const p=$("pwd").value.trim()
if(!p)return $("err").textContent="Password diperlukan"
try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});if(!r.ok){const d=await r.json();throw Error(d.error||"Login gagal")};location.reload()}catch(e){$("err").textContent=e.message;$("err").style.color="#ef4444"}}
</script>
</body></html>
