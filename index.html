<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUMEN Fans Club</title><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font:400 15px/1.6 system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-page{width:100%;max-width:440px;padding:24px}
.login-card{background:#fff;border-radius:20px;padding:48px 36px 40px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 32px rgba(0,0,0,.06);text-align:center}
.logo{width:64px;height:auto;margin-bottom:24px}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.subtitle{color:#64748b;font-size:14px;margin-bottom:28px}
.alert{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:14px 18px;color:#4338ca;font-size:13px;line-height:1.6;margin-bottom:24px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.alert-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.field input{font:inherit;width:100%;padding:13px 16px;border:2px solid #e2e8f0;border-radius:12px;outline:none;font-size:15px;color:#0f172a;background:#f8fafc;transition:all .2s}
.field input:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(129,140,248,.1);background:#fff}
.btn{font:inherit;font-weight:700;cursor:pointer;border:none;transition:all .2s;width:100%;padding:15px;border-radius:12px;font-size:15px;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.25)}
.btn:active{transform:scale(.97)}
.error{color:#ef4444;font-size:13px;margin-top:10px;min-height:20px;text-align:center}
@media(max-width:480px){.login-card{padding:36px 24px 32px}}

wasa dan fokus ke kontribusi nyata. semangat terus buat kader2 muda dan senior, bersatu bangun daerah \ud83d\udcaa\ud83c\uddee\ud83c\udde9"], "thumb": "https://scontent.cdninstagram.com/v/t51.82787-15/764693403_18260342578305543_6649436581695432818_n.jpg?stp=c364.0.1092.1092a_dst-jpg_e35_s640x640_tt6&_nc_cat=106&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=8ng7eX8rbLIQ7kNvwG6jPDI&_nc_oc=AdpTrl0lrvP-GNIwWM_VkkpQvdTuGafa77mIJm6Dx3zmMKfNjIt6l09zWEWbI7xLPmpB8DLURBa58v2Ps5V9qI8G&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=oLN9VfaSAAvtiwptmIPYZQ&_nc_ss=7b60f&oh=00_AQHU-j6lfUv4ETG3pTudEd8Wrverr8acaYnQBp4sCwDICQ&oe=6A7EDACE", "description": "101 likes, 10 comments - duniameutya on August 2, 2026: &quot;Musda XI DPD Partai Golkar Provinsi Sumatera Selatan.\n\n#meutyahafid #menkomdigi #menterimeutya&quot;."}, {"id": 5, "title": "05 Perlindungan Anak", "source_url": "https://www.instagram.com/p/DbkOnWXRq3i/", "comments": ["nah ini nih yg paling saya tunggu2 sbg ibu... keamanan online buat anak2 wajib jadi prioritas. anak saya tiap hari megang hp, saya khawatir bgt sm konten2 berbahaya. terima kasih bu meutya udh dorong regulasi ini \ud83d\ude4f\ud83d\ude2d\ud83d\ude2d", "ibuuu... saya nangis bgt bacanya \ud83d\ude2d akhirnya ada pemimpin yg serius mikirin keamanan digital anak2 kita. selama ini ibu2 cuma bisa khawatir sendiri, skrg ada regulasi yg diperjuangkan. terima kasih bu meutya, kami ibu2 indonesia mendukung penuh \u2764\ufe0f\ud83d\ude4f", "sebagai ibu dua anak, ini isu yg paling saya peduliin... anak2 kita rentan banget sm predator online, konten kekerasan, cyberbullying. dorongan bu meutya soal regulasi ini bikin saya lega sbg orangtua. semoga cepat disahkan \ud83d\udc9a\u2728", "buibu rame2 dukung ini yuk... keamanan online anak bukan isu sepele. terima kasih bu meutya udh berani angkat isu ini ke level regulasi. semoga nanti ada sistem yg bener2 melindungi anak2 kita dr bahaya internet \ud83d\ude4f\ud83d\ude2d", "ini mah bukan cuma regulasi, ini penyelamat generasi... anak2 indonesia harus bisa jelajah internet dgn aman dan nyaman. bu meutya satu2nya menteri yg berani all out soal ini. saya sbg ibu sangat berterima kasih \u2764\ufe0f\ud83c\uddee\ud83c\udde9", "gasss... ini nih yg penting bgt!!! keamanan online buat anak2 udah darurat sih. konten bahaya bertebaran, anak2 gampang banget akses. salut bu meutya berani jadi garda terdepan isu ini \ud83d\udd25\ud83d\udd25\ud83d\udd25", "akhirnya ada menteri yg mikirin nasib anak2 di ranah digital... gak cuma ngurusin infrastruktur doang tp juga perlindungan penggunanya. bu meutya emg pemimpin yg komplit dan punya hati \u2764\ufe0f\ud83d\ude2d", "top markotop... regulasi keamanan online buat anak tuh emg dari dulu ditunggu. orang tua mana sih yg gak khawatir anaknya buka situs aneh2. bu meutya paham bgt keresahan rakyat kecil kaya saya \ud83d\udc9a\ud83d\ude4f", "nah ini dia action nyata... ngomongin perlindungan anak di ranah digital itu gak gampang, butuh keberanian. bu meutya gak cuma ngomong, tp langsung dorong regulasi. respect maksimal buat beliau \ud83d\udc4f\ud83d\udd25", "setuju bgt... anak indonesia harus dilindungi di dunia maya jg. konten berbahaya, judi online yg nyasar ke anak2, predator \u2014 ini semua harus ditindak tegas lewat regulasi. terima kasih bu meutya yg berani \ud83d\udeab\ud83d\udd25", "Regulasi keamanan online untuk anak-anak adalah kebutuhan mendesak. Dorongan Bu Meutya terhadap isu ini menunjukkan visi yang melampaui infrastruktur \u2014 menyentuh perlindungan generasi penerus. Sangat kami apresiasi. \ud83d\udc9a\ud83c\uddee\ud83c\udde9", "Langkah bersejarah dalam kebijakan digital Indonesia. Perlindungan anak di ranah online akhirnya punya champion di level menteri. Semoga regulasi ini segera terwujud dan jadi warisan berharga bagi bangsa. \ud83d\udc4f\u2728", "Keamanan digital untuk anak-anak harus dimulai dari kebijakan negara yang tegas. Bu Meutya menunjukkan kepemimpinan progresif dengan mendorong regulasi ini. Anak-anak Indonesia berhak tumbuh dalam ekosistem digital yang sehat. \ud83d\udd25\ud83d\ude4f", "sebagai kakak dari adik2 yg tiap hari main tiktok dan youtube, ini isu yg hits banget... konten gak pantas gampang banget muncul. keren bgt bu meutya gas pol dorong regulasi perlindungan anak di dunia maya \ud83d\ude80\ud83d\udd25", "anak muda kaya aku merasa terlindungi jg... krn regulasi ini gak cuma buat anak kecil, tp jg remaja yg rentan sm konten negatif. bu meutya emg mikirin semua lapisan usia, salutt poll \u2728\ud83d\udc9a"], "thumb": "https://scontent.cdninstagram.com/v/t51.82787-15/763692380_18260483512305543_4238835949785280107_n.jpg?stp=cmp1_dst-jpg_e35_s640x640_tt6&_nc_cat=101&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ%3D%3D&_nc_ohc=aKM7CZ3FYOcQ7kNvwE5S5Sn&_nc_oc=Ado-Vsqryvzoh3n5ZB1YQJCPBbLupD_TZFfBPsZcNjcdF_Lu9ja4zctGuJyzhNgUuxCmcWU7-kLS0c0sFhemanGF&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=wLx6xXhqTEwNXFafp9LuXA&_nc_ss=7b60f&oh=00_AQETm7LGZP-98vy8mZT9yuWYb7zFbtRb-xbklJFcsSyRMg&oe=6A7EED5B", "description": "347 likes, 27 comments - duniameutya on August 2, 2026: &quot;Anak tidak boleh dijadikan alat promosi produk yang berisiko bagi kesehatan mereka. Ruang digital juga harus menjadi ruang yang melindungi, bukan mengeksploitasi.\n\nKemkomdigi melayangkan Surat Teguran Pertama kepada YouTube setelah ditemukan siaran langsung yang diduga melibatkan anak di bawah umur dalam promosi produk rokok elektronik (vape). Melalui surat tersebut, YouTube diminta segera menindak konten terkait, memperkuat sistem moderasi, meningkatkan kecepatan penanganan, serta memastikan mekanisme deteksi dan pembatasan usia berjalan lebih efektif. Platform diberikan waktu paling lambat tiga hari untuk menindaklanjuti temuan tersebut.\n\nBagi Menteri Komunikasi dan Digital Meutya Hafid, perlindungan anak di ruang digital bukan sekadar tanggung jawab pemerintah. Platform digital, kreator konten, orang tua, dan seluruh masyarakat memiliki peran yang sama penting agar ruang digital tetap aman bagi anak-anak.\n\n#meutyahafid #menkomdigi #menterimeutya&quot;."}, {"id": 6, "title": "06 Komunikasi Publik", "source_url": "https://www.instagram.com/p/Dbk1LgVR4SW/", "comments": ["nah gini nih yg dibutuhin... komunikasi publik yg transparan dan akuntabel bgt... jadi kita sbg rakyat tau apa yg dikerjakan pemerintah... semangat terus bu meutya \ud83d\ude4f\u2728", "jujur sbg ibu rumah tangga aku berasa dihargai... komunikasi terbuka gini bikin kita ngerti arah kebijakan yg berdampak ke keluarga... lanjutkan bu meutyaaa \u2764\ufe0f\ud83d\udc4f", "penting bgt bu ibu... komunikasi yg jelas dan nggak ditutup2in... anak2 kita nanti jg bakal ngerasain dampaknya... terimakasih udah jadi pemimpin yg terbuka \ud83d\ude4f\ud83d\udcaa", "Salut banget sama keterbukaan Bu Meutya! Beliau ngomong apa adanya, jujur dan transparan ke publik. Gaya komunikasi yang lugas bikin rakyat percaya. Semoga makin banyak pemimpin yang ngikutin langkah beliau. Keren! \ud83d\ude4c", "transparansi itu kunci sih... jarang2 ada pejabat yg bener2 mau buka2an soal kinerja... salut bgt sm bu meutya... ini yg bikin rakyat percaya... gaskeunnn terus \ud83d\udd25\ud83d\udd25", "nah ini dia yg ditunggu2... komunikasi yg nggak muter2... langsung to the point dan bisa dipertanggungjawabkan... keren abis deh pokoknya... wkwkwk \ud83d\ude04\ud83d\udc4f\u2728", "bener bgt bu... rakyat butuh transparansi bukan drama... semoga makin banyak instansi yg ngikutin jejak ibu... maju terus kominfo di bawah kepemimpinan ibu \ud83d\udcaa\u2728", "jujurly... dulu skeptis tp liat konsistensi bu meutya soal komunikasi publik... aku jadi percaya deh... keep it real bu... semangat terus majuin transparansi \ud83d\ude4f\ud83d\udd25", "Nah gini nih pejabat idaman! Bu Meutya ngomong apa adanya, transparan, dan kerja nyatanya keliatan banget. Gaya kepemimpinannya humble tapi tegas. Indonesia butuh lebih banyak pemimpin kayak beliau. Lanjutkan! \ud83d\udcaa", "Komunikasi publik yang transparan dan akuntabel adalah fondasi kepercayaan rakyat. Langkah Bu Meutya menunjukkan komitmen nyata terhadap good governance. Terus pertahankan standar keterbukaan ini \ud83d\udc4f\u2728", "Di era informasi yang serba cepat, keterbukaan menjadi sangat krusial. Bu Meutya membuktikan bahwa komunikasi publik bisa dilakukan dengan jujur dan terukur tanpa kehilangan esensi pelayanan. Salut \ud83c\uddee\ud83c\udde9", "Akuntabilitas bukan sekadar slogan \u2014 dan Bu Meutya menunjukkan itu lewat komunikasi yang lugas dan dapat diverifikasi. Semoga menjadi budaya baru di pemerintahan kita \ud83d\ude4f", "Bu Meutya bener-bener peduli transparansi dan langsung dibuktiin dengan tindakan nyata! Setiap kebijakan dijelasin secara terbuka ke publik. Semoga konsisten terus dan jadi inspirasi buat pelayanan publik. Keren! \ud83c\udf1f", "gen Z approve sih ini... jujur dan transparan itu vibes yg kita butuhin dari pemerintah... nggak neko2... lurus aja... gas teruss bu meutya kami di belakang ibu \ud83d\udd25\ud83d\ude04\ud83d\udcaa", "komunikasi publik yg akuntabel tuh langka bgt di indonesia... salut bu meutya berani buka2an... semoga jadi role model buat kementerian lain... bangga punya pemimpin kayak ibu \ud83d\ude4f\u2728"], "thumb": "https://scontent.cdninstagram.com/v/t51.82787-15/764719637_18260484490305543_3271044383810645043_n.jpg?stp=cmp1_dst-jpg_e35_s640x640_tt6&_nc_cat=108&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ%3D%3D&_nc_ohc=-TVC6IDZWTUQ7kNvwE0AXJF&_nc_oc=AdpYz7aZQs9QJ-2f_WAkyQz7_9bEovHGZ5vgbAczKmdFCnTBZfSk-nJGxd_AinMr5mXGZkhi49NNMNhGDOtlJmHQ&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=ZrqlpO7xbDZZHUUaUkeUhw&_nc_ss=7b60f&oh=00_AQG6mLFSYT6UAdDL_ly_Pj6EKAorqz7dAUf0YzIL-aorlQ&oe=6A7EF2EA", "description": "120 likes, 38 comments - duniameutya on August 3, 2026: &quot;Konten digital yang melibatkan anak atau melanggar privasi bukan sekadar persoalan etika. Ada aturan yang harus dipatuhi dan konsekuensi hukum jika dilanggar.\n\nKemkomdigi telah melayangkan surat peringatan kepada YouTube terkait konten promosi vape yang melibatkan anak. Menurut Menkomdigi Meutya Hafid, konten tersebut tidak hanya bertentangan dengan regulasi di Indonesia, tetapi juga melanggar community guidelines milik platform itu sendiri.\n\nDalam kesempatan yang sama, Menkomdigi juga menyoroti maraknya perekaman seseorang tanpa izin, termasuk di ruang publik. Praktik tersebut dapat melanggar Undang Undang Perlindungan Data Pribadi sekaligus melanggar etika. Karena itu, Kemkomdigi bersama aparat penegak hukum mendorong penindakan yang serius untuk melindungi masyarakat, khususnya perempuan dan anak, dari tindakan perekaman tanpa persetujuan.\n\nRuang digital yang aman tidak cukup dibangun dengan teknologi. Ia juga membutuhkan kepatuhan terhadap aturan dan penghormatan terhadap hak setiap orang.\n\n#meutyahafid #menkomdigi #menterimeutya&quot;."}, {"id": 7, "title": "07 Perlindungan Publik", "source_url": "https://www.instagram.com/p/DblCLRWE_fc/", "comments": ["ini yg paling aku khawatirin sbg ibu... data anak2 kita di dunia maya... semoga perlindungan data pribadi makin ketat ya bu... terimakasih udah peduli \ud83d\ude4f\u2764\ufe0f", "jujur tiap denger kasus bocornya data warga tuh deg2an... apalagi data keluarga... makasih bu meutya udah serius nanganin keamanan siber nasional... kami percaya sm ibu \ud83d\udcaa\ud83d\udd12", "buibu pasti setuju... data pribadi anak2 harus dilindungi bgt... jaman sekarang main sosmed aja bisa kena hack... salut bu meutya prioritasin ini dulu \ud83d\ude4f\u2728", "akhirnya ada yg mikirin keamanan data rakyat kecil juga... bukan cuma yg punya duit doang... terimakasih bu... lindungi kami dan anak2 kami dari kejahatan digital ya \ud83d\ude4f\u2764\ufe0f", "nah ini penting bgt sumpah... data pribadi udah kayak komoditas skrg... bocor dikit bisa disalahgunakan... salut bu meutya seriusin keamanan siber nasional \ud83d\udd25\ud83d\udd12", "gk main2 ya bu soal perlindungan data... aku ngerasa lebih aman skrg... walaupun masih was2 sih tp at least ada yg peduli... lanjutkan bu terus perkuat sistemnya \ud83d\udc4f\u2728", "keamanan siber itu urgent bgt apalagi banyak kasus pinjol ilegal nyalahin data... keren bu meutya udah dari sekarang ancang2... respect dahhh semoga makin solid \ud83d\udd25\ud83d\udcaa", "setuju bgt... data pribadi itu hak dasar warga negara... bukan buat dijual2in sm pihak ketiga... salut bu meutya majuin perlindungan publik di ranah digital \ud83d\udc4f\ud83d\udd12\u2728", "ini langkah nyata yg kita butuhin... bukan cuma wacana... perlindungan data rakyat harus jadi prioritas... makasih bu meutya udah berani ambil sikap \ud83d\ude4f\u2728", "wihhh keren... selama ini siapa yg mikirin data rakyat bocor... paling cuma omongan doang... ini beneran ada gebrakan nyata... mantappp bu meutya lanjutkan \ud83d\udd25\ud83d\udd25\ud83d\udcaa", "Perlindungan data pribadi dan keamanan siber bukan lagi opsional \u2014 ini keharusan di era digital. Bu Meutya menunjukkan kepemimpinan visioner dengan memprioritaskan keamanan rakyat di ruang siber. Teruskan \ud83c\uddee\ud83c\udde9\ud83d\udd12", "Di tengah maraknya kebocoran data dan serangan siber, langkah Bu Meutya memperkuat pertahanan siber nasional adalah angin segar. Rakyat butuh jaminan bahwa data mereka aman. Apresiasi setinggi-tingginya \ud83d\udc4f\u2728", "Ketahanan siber nasional dimulai dari perlindungan data setiap warga. Bu Meutya membawa isu ini ke permukaan dengan serius dan terstruktur. Semoga implementasinya makin kuat ke depan \ud83d\ude4f", "anak muda nih yg paling rentan sih... data bocor dikit aja bisa disalahgunakan... apresiasi bgt bu meutya serius di isu keamanan siber... keren abis \ud83d\udd25\ud83d\udd12", "sebagai mahasiswa IT... isu keamanan siber ini deket bgt sm keseharian... salut bu meutya udah naikin isu ini ke prioritas nasional... semangat terus bu \ud83d\udcaa\u2728"], "thumb": "https://scontent.cdninstagram.com/v/t51.82787-15/763308773_18371113426232583_2341512719453199561_n.jpg?stp=cmp1_dst-jpg_e35_s640x640_tt6&_nc_cat=109&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=xcj8Ex5YvfoQ7kNvwEEbFgA&_nc_oc=AdpkXbPct9QqjL6z6cO62qGHomMWvcKmgipEyUW8FAtFNR9GK7UlLsfn5JaZTmvpQpyEjkblxFthFS0GHO237BCW&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=IJOqyX6Tej2l4C1OJLvmXA&_nc_ss=7b60f&oh=00_AQH_af9TpwE1_A0ACXnK7xEj3672DOtEAX3CRXNKBSFODQ&oe=6A7EE1B5", "description": "228 likes, 16 comments - indonesiago.id on August 3, 2026: &quot;Kebebasan Pers adalah pilar demokrasi yang tidak bisa ditawar. Beredar rumor di media sosial bahwa pemerintah melarang pers meliput aksi demonstrasi. Menteri Komunikasi dan Digital (Menkomdigi) Meutya Hafid tegaskan hal itu: &#x201c;Tidak Betul!&#x201d;\n\nPemerintah tidak pernah melarang pers melakukan peliputan dalam bentuk apa pun, selama sesuai kaidah jurnalistik dan UU Pers. Justru, keberadaan pers yang cepat dan akurat sangat dibutuhkan agar ruang digital kita tidak dikuasai oleh disinformasi.\n\n#KebebasanPers #Indonesiagoid #InformasiPublik #BergerakBerdampak #KitaIndonesia&quot;."}, {"id": 8, "title": "08 Dialog Masyarakat", "source_url": "https://www.instagram.com/p/DblJ-KqOGhF/", "comments": ["seneng bgt liat pemimpin yg mau turun langsung dengerin aspirasi... nggak cuma duduk di kantor doang... ini yg kita butuhin sbg ibu2... didengerin \ud83d\ude4f\u2764\ufe0f", "bu meutya bener2 humble ya... mau dialog langsung sm warga... anak2 aku nanti jg pengen pemimpin kayak gini... yg dengerin rakyatnya sendiri tanpa perantara \ud83d\udcaa\u2728\u2764\ufe0f", "liat foto ini terharu... jarang ada pejabat yg mau duduk bareng rakyat biasa dan dengerin curhatan... terimakasih bu meutya udah mau turun ke bawah \ud83d\ude4f\ud83d\ude2d", "dialog langsung gini yg bikin rakyat merasa dihargai... nggak cuma dikasih program tp ditanya dulu apa yg dibutuhin... keren bgt bu meutya... sehat selalu \ud83d\udc4d\u2764\ufe0f\u2 ak aku jg ngerasain dampaknya... semakin mudah akses informasi publik... selamat bu \ud83d\ude4f\ud83c\udf89", "selamat buuu... penghargaan keterbukaan informasi publik ini bukti nyata dedikasi ibu... anak2ku nanti jg harus tau kalo transparansi itu penting... bangga bgt \ud83d\ude2d\u2764\ufe0f", "predikat informatif dari KIP tuh bergengsi loh buibu... artinya emang bener2 terbuka dan melayani... selamat bu meutya... pantas bgt dapet penghargaan ini \ud83d\udc4f\u2728", "aku ikut seneng denger kabar ini... rasanya perjuangan keterbukaan informasi terbayar... selamat bu meutya... ibu inspirasi banget buat kami para ibu muda \ud83d\ude4f\u2764\ufe0f\u2728", "wihhh selamat bu meutya... predikat informatif dari KIP tuh nggak kaleng2... ini bukti kalo kerja keras transparansi diakui... bangga bgt jadi rakyat indonesia \ud83d\udd25\ud83d\udd25\ud83c\udf89", "Selamat Bu Meutya! Pantas banget sih dapet penghargaan ini. Keterbukaan informasinya emang terasa banget, semua kebijakan dan program dikomunikasikan dengan jelas ke publik. Transparansi adalah kunci! Bangga! \ud83c\udfc6\u2728", "nah gini dong... transparansi yg berbuah manis... selamat bu meutya atas predikat informatif dari KIP... semoga makin termotivasi untuk terus terbuka \ud83d\udcaa\ud83c\udf89", "kirain cuma omongan doang soal keterbukaan... ternyata beneran berprestasi sampe dapet penghargaan... respect dah... selamat bu meutyaa pantas bgt \ud83d\udd25\ud83d\udc4f\u2728", "penghargaan KIP informatif ini bukti kalo rakyat dan institusi ngakuin transparansi kominfo... salute buat bu meutya dan seluruh tim... gaskeunnn terus \ud83c\udf89\u2728\ud83d\udc4f", "Predikat 'Informatif' dari KIP adalah pengakuan atas komitmen keterbukaan informasi publik yang konsisten. Bu Meutya membuktikan bahwa transparansi bukan sekadar wacana. Selamat atas prestasi yang membanggakan ini \ud83d\udc4f\ud83c\uddee\ud83c\udde9", "Penghargaan keterbukaan informasi publik ini menegaskan bahwa pemerintahan yang terbuka bukanlah utopia. eutya... wkwkwk akhirnya \ud83d\ude4f\ud83d\udd25", "RANA ini bukti kalo bu meutya nggak cuma ngomong tp beneran action... perlindungan anak adalah investasi masa depan bangsa... mantaplah bu terus maju \ud83d\udd25\ud83d\udc4f\u2728\ud83d\ude4f", "selama ini gelisah liat anak2 main tiktok bebas tanpa pengawasan... sekarang ada harapan... RANA anak bikin optimis... terimakasih bu meutyaaa kami selalu dukung \ud83d\ude2d\u2728\ud83d\ude4f", "Peluncuran Rencana Aksi Nasional Perlindungan Anak di Ranah Digital adalah langkah monumental yang sangat dinantikan. Bu Meutya menunjukkan kepedulian tulus terhadap generasi penerus bangsa. Semoga implementasinya sukses \ud83d\ude4f\ud83c\uddee\ud83c\udde9", "Di tengah masifnya penetrasi digital pada anak-anak, RANA hadir sebagai payung perlindungan yang komprehensif. Ini adalah warisan kebijakan yang akan dirasakan manfaatnya oleh generasi mendatang. Salut Bu Meutya \ud83d\udc4f\u2728", "RANA membuktikan bahwa perlindungan anak adalah prioritas nasional, bukan sekadar isu sampingan. Kepemimpinan Bu Meutya dalam isu ini patut diapresiasi setinggi-tingginya. Anak Indonesia kini punya tameng digital \ud83d\ude4f", "sebagai kakak dari adik2 kecil... RANA ini bikin lega bgt... akhirnya ada kebijakan yg lindungi anak2 dari bahaya internet... makasih bu meutya kami dukung \ud83d\udcaa\u2728\ud83d\ude4f", "anak muda kayak aku tau bgt ganasnya dunia digital... apalagi buat anak di bawah umur... RANA ini langkah visioner... bangga punya menteri kayak bu meutya \ud83d\udd25\ud83d\ude4f"], "thumb": "https://scontent.cdninstagram.com/v/t51.82787-15/766748077_18260693074305543_7078068677875222706_n.jpg?stp=cmp1_dst-jpg_e35_s640x640_tt6&_nc_cat=103&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=lMTyL2O6JUsQ7kNvwHmFK-Y&_nc_oc=AdpkZ8XxDPvdJ4oe2RC09J6rXfVU73vL88Hs2huszPdAhs0uAFu_ESVfXrr0gNftukmStY5cGz5QFyrSdbzmx6lV&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=jKi5pq3UfeHr25yagm4y9w&_nc_s 2787-15/764619230_18260705014305543_8386583550944034646_n.jpg?stp=cmp1_dst-jpg_e35_s640x640_tt6&_nc_cat=110&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ%3D%3D&_nc_ohc=p2BsDFWmsNUQ7kNvwFz-ey-&_nc_oc=Adq3I74KD3qI2OmT1DVmkKFGnTzodbnnT3EXdAP_be4EnDBEkU-SiJRFWJ0eusK1zVkpx5XS-LID0gGbze3iUBjz&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=5TkRFKTh0dq49xyg9JBBLw&_nc_ss=7b60f&oh=00_AQGrrA3OszQLafTKpjjr4qNN6aXOX2QUsdYDGYqYbi128A&oe=6A7EFD31", "description": "71 likes, 7 comments - duniameutya on August 5, 2026: &quot;Yang paling berbahaya dari hoaks bukan cuma kebohongannya.\n\nTapi rasa takut yang ditinggalkan. Rasa curiga yang ditanamkan. Mengadu domba sesama anak bangsa. Mengikis kepercayaan. Bahkan membuat masyarakat mengambil langkah berdasarkan informasi yang tidak benar. Dan ketika kita mulai saling percaya pada kabar yang belum tentu benar, yang retak bukan cuma ruang digital, tapi juga persatuan kita.\n\nBoleh berbeda pendapat. Boleh menyampaikan aspirasi. Itulah demokrasi.\n\nTapi jangan biarkan hoaks mengambil alih akal sehat kita.\n\nIndonesia terlalu berharga untuk dipecah oleh informasi yang sengaja dipelintir.\n\nMendekati HUT RI, hati-hati provokasi!\n\n#meutyahafid #menkomdigi #menterimeutya&quot;."}, {"id": 12, "title": "12 Riset BRIN", "source_url": "https://www.instagram.com/p/DbtFV4_hKjO/", "comments": ["liat bu meutya dampingi pak prabowo di istana rasanya bangga bgt... apalagi ini soal riset dan anak2 bangsa \ud83d\ude4f semoga hilirisasi riset beneran jalan ya bu, biar anak2 kita nanti tinggal nikmatin hasilnya... amin \ud83e\udd32\u2728", "buibu... ini kabar baik bgt loh, 150 periset BRIN diterima di istana \ud83e\udd7a berarti riset indonesia makin dilirik ya... salut bu meutya selalu hadir di momen2 penting kayak gini, semoga riset kita makin mendunia \ud83d\udcaa\ud83c\uddee\ud83c\udde9", "anakku seneng bgt liat berita ini... dia pengen jadi peneliti soalnya \ud83d\ude2d liat bu meutya dampingin pak prabowo urus riset, jadi makin semangat deh... terima kasih buat perhatiannya ke dunia penelitian \ud83d\ude4f\u2728", "ini bukti nyata kalo pemimpin kita peduli sm masa depan iptek... dampingi 150 periset di istana itu bukan hal kecil loh \ud83d\ude2d salut bgt bu meutya, dari dulu konsisten dorong riset... semoga hilirisasinya berhasil ya bu \ud83d\udcaa\ud83d\ude4f", "ibu2 pasti setuju nih... riset itu investasi masa depan anak cucu kita \ud83d\ude4f seneng bgt liat bu meutya bareng pak prabowo seriusin ini, mudah2an para peneliti kita makin bersinar setelah audiensi ini \u2728\ud83c\uddee\ud83c\udde9", "buset keren bgt... 150 periset BRIN diundang ke istana \ud83d\ude2d ini sih levelnya udah menteri kelas atas bgt... salut bu meutya selalu ada di barisan depan dukung anak bangsa, gaskeun hilirisasi riset \ud83d\udd25\ud83d\udcaa", "nah ini dia momen yg bikin optimis... riset indonesia ga cuma numpuk di perpustakaan, tp beneran didorong sampe ke hilir \ud83d\ude2d keren bgt bu meutya, semangat terus buat reformasi risetnya \ud83d\ude4f\ud83d\udd25", "wihhh akhirnya ada gebrakan serius soal riset... biasanya kan cuma wacana doang ya, tp ini beneran 150 orang diterima langsung di istana \ud83d\ude33 respect bgt sm bu meutya dan pak prabowo... ditunggu gebrakan berikutnya \ud83d\udc4f", "kerennn pol... liat foto bu meutya di istana bareng para periset tuh aura positifnya dapet bgt \ud83d\ude2d lama2 riset indonesia bisa setara korsel nih kalo terus digas kayak gini... semangat bu \ud83d\udcaa\ud83c\uddee\ud83c\udde9", "akhirnya ada pemimpin yg bener2 ngerti pentingnya riset... bu meutya emg beda, ga cuma ngomong doang tp beneran hadir dan fasilitasi \ud83d\ude2d semoga hilirisasi riset makin cepet dan berdampak luas ya bu \ud83e\udd32\u2728", "Momen monumental bagi riset Indonesia. Mendampingi Presiden Prabowo menyambut 150 periset BRIN menunjukkan komitmen serius terhadap hilirisasi riset. Ibu Meutya terus membuktikan riset sebagai fondasi kemajuan bangsa.", "Hilirisasi riset adalah jembatan antara laboratorium dan masyarakat. Kehadiran Ibu Meutya di Istana bersama 150 periset BRIN menandakan era baru bagi inovasi Indonesia. Terima kasih telah menjadi katalisator penting dalam perjalanan ini.", "150 peneliti terbaik bangsa diterima di Istana Negara \u2014 ini bukan sekadar seremoni, tapi pernyataan bahwa riset Indonesia naik kelas. Ibu Meutya Hafid adalah salah satu tokoh kunci di balik momentum bersejarah ini. Hormat kami.", "gokil sih 150 periset langsung ke istana \ud83d\ude2d anak sains kayak aku tuh liat ini jadi makin yakin riset di indonesia ada harapan... makasih bu meutya, jadiin riset itu keren dan bergengsi... lanjutkan bu \ud83d\udd25\ud83d\udd2c\u2728", "akhirnya riset dapat spotlight yg layak... sebagai mahasiswa riset, liat bu meutya dorong hilirisasi tuh bikin semangat ngerjain skripsi wkwk \ud83d\ude2d semoga nanti kami jg bisa ikut berkontribusi buat bangsa \ud83c\uddee\ud83c\udde9\ud83d\udcaa"], "thumb": "https://scontent.cdninstagram.com/v/t51.82787-15/766074375_18260876311305543_1119088806163192269_n.jpg?stp=cmp1_dst-jpg_e35_s640x640_tt6&_nc_cat=101&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ%3D%3D&_nc_ohc=5ZXF4DCmscMQ7kNvwH2L_Fo&_nc_oc=AdoSJyF8xZdB31M9Gce0OdIdkFos6pjs6tZ0el01vxte5178ikxDQU9dPLyVxutkQgqUP6PJn5K7BIMxdY0uaWnk&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=nZEGmC5M8yPL4NlZIM5kgw&_nc_ss=7b60f&oh=00_AQF3Z6hhN1jVsPRcOOZ1rv_i_X59PK4e8aq8M0B8RVCxrQ&oe=6A7ECC35", "description": "1,737 likes, 51 comments - duniameutya on August 6, 2026: &quot;Riset dan inovasi adalah fondasi penting untuk membangun Indonesia yang maju dan berdaya saing. Karena itu, untuk pertama kalinya Presiden Prabowo mengundang 150 periset BRIN dari seluruh Indonesia ke Istana Kepresidenan untuk memamerkan sekaligus memaparkan hasil riset strategis karya anak bangsa.\n\nMenkomdigi Meutya Hafid turut mendampingi Presiden Prabowo dalam pertemuan tersebut sebagai bagian dari komitmen pemerintah unt
